<!-- ==========================================================================
     FRAGMENTO: MOMENTOS  ·  id="momentos"
     CSS propio: styles/sections/momentos.css
     JS propio:  js/momentos-video.js   (reproducción perezosa de los clips)

     QUÉ ES: una banda de carbón que corta la página crema entre #planes y
     #colegios. Es la única pausa visual del recorrido: sirve para respirar,
     no para informar. Desde v3.1 ya no es una rejilla de fotos: es un MURO
     DE VÍDEO en vertical, metraje de móvil grabado en el predio.

     QUÉ CAMBIÓ EN v3.2 — EL MARCADO
       Sólo dos cosas, y ninguna toca el texto:
         · La cabecera pierde la clase de tamaño y gana el trato de CARTELA
           en la hoja (rótulo y titular en la misma línea de base, con filete
           a todo lo ancho). No cambia el marcado.
         · Cada pieza añade `reveal--velo` junto a `reveal`. Es la cortina de
           clip-path que ya estaba escrita en base.css §6 y que no usaba
           NINGUNA sección del sitio: la pieza se descubre de arriba abajo en
           vez de aparecer con un fundido. Es el gesto que le corresponde a un
           muro de vídeo, y al usarse sólo aquí no se gasta el recurso.
       Todo lo demás de la composición (anchos, desfases, sangría por la
       derecha, grano y viñeta) vive en momentos.css y no necesita marcado.

     POR QUÉ VERTICAL Y POR QUÉ ESCALONADO
       Los seis clips son 720×1280, retrato, sin pista de audio: son de
       teléfono, no de banco de imágenes. Presentarlos en una rejilla regular
       de recuadros iguales los devolvería al terreno del «genérico»: lo que
       delata a un muro de archivo es la simetría. Aquí van CUATRO piezas de
       anchos distintos (protagonista + tres menores) y con desfases
       verticales desiguales, de modo que la línea de arriba nunca coincide
       y la de abajo tampoco. La composición está en momentos.css §3.

     QUÉ POSEE ESTA SECCIÓN (ARQUITECTURA-V3, «un hecho, un dueño»)
       NADA. Ni un solo hecho. Esta sección es ATMÓSFERA PURA y por eso puede
       borrarse entera sin que la página pierda un dato.

     QUÉ TIENE PROHIBIDO DECIR
       TODO hecho: aforos, precios, horarios, direcciones, superficies,
       distancias, cifras de especies, condiciones de alquiler, nombres de
       espacios y nombres de planes. Los pies describen LO QUE SE VE en el
       clip y se paran ahí.
       OJO ESPECIAL CON ESTOS CLIPS: el jardín de polinizadores es un hecho
       de #colegios. Aquí se pueden VER mariposas y flores —son imagen—, pero
       no se puede afirmar que exista un jardín ni describirlo como
       instalación. Por eso ningún pie nombra «polinizadores», «jardín de
       mariposas» ni «avistamiento»: se describe el encuadre, no el
       equipamiento. Por lo mismo NO se usa el sexto clip disponible,
       video/jardin-polinizadores.*: su ruta viaja en el atributo `poster`,
       que herramientas/validar.py sí lee como texto, y colaría la palabra
       «polinizador» dentro de una sección que no es su dueña.

     LOS CUATRO CLIPS, EN ORDEN DE LECTURA
       01  video/mariposa-naranja.*   3,6 s · plano abierto de las varas
       02  video/verbena-viento.*     6,2 s · primer plano, la vara se mece
       03  video/mariposa-amarilla.*  4,6 s · contraluz, amarilla al borde
       04  video/mariposas-par.*      2,1 s · dos naranjas, la más pequeña
       Cada <video> lleva el webm PRIMERO y el mp4 después (el webm pesa más
       aquí, pero el orden lo decide el navegador por soporte, no por tamaño;
       Safari cae al mp4). `width`/`height` son los del archivo y el marco
       tiene `aspect-ratio`, así que no hay salto de layout.

     EL PÓSTER ES EL SUELO, NO HAY <img> DEBAJO
       Cada clip trae su propio fotograma en img/video/<mismo-nombre>.jpg.
       Si el vídeo no carga, si no hay JS, si el navegador bloquea la
       reproducción o si el usuario pide menos movimiento, se queda esa foto
       fija: nunca un hueco negro. Poner además un <img> debajo duplicaría la
       descarga para enseñar exactamente la misma imagen.
       Los cuatro pósters (unos 600 kB en total) SÍ se descargan siempre, aunque
       el visitante no llegue a esta altura de la página: `poster` no admite
       carga diferida. Es el precio de que la sección nunca aparezca vacía, y se
       paga a sabiendas. Los clips, que pesan varios megas, no se tocan hasta
       que la banda entra en pantalla.

     NO HAY ICONO DE PLAY, Y NO SE PONE
       Los clips arrancan solos, en silencio y en bucle, cuando entran en
       pantalla; se pausan al salir. No hay nada que pulsar, así que un
       triángulo encima sería un control falso. Toda esa lógica —incluida la
       de `prefers-reduced-motion`— vive en js/momentos-video.js.

     POR QUÉ EL <script> VA AQUÍ DENTRO Y NO AL FINAL DEL <body>
       herramientas/ensamblar.py copia tal cual la cola de index.html
       (donde están app.js y mapa.js), así que un fragmento no puede añadir
       nada allí. Se carga con `defer`, de modo que no bloquea el parseo y se
       ejecuta con el DOM ya completo, igual que los otros dos. Si el
       integrador prefiere tenerlo junto a los demás, puede moverlo a la cola
       de index.html y borrar esta línea: el JS no depende de dónde se cargue.

     POR QUÉ NO ESTÁ EN LA NAVEGACIÓN NI EN EL PIE
       Porque no es un destino. Nadie busca «momentos» en un menú; se lo
       encuentra al bajar. Meterla en el menú la convertiría en una promesa
       de contenido que esta sección no tiene intención de cumplir.
     ========================================================================== -->
<section id="momentos" class="seccion seccion--carbon momentos" aria-labelledby="momentos-titulo">
  <div class="contenedor">

    <header class="seccion-encabezado momentos__encabezado reveal">
      <p class="eyebrow">Momentos</p>
      <h2 id="momentos-titulo" class="titulo-seccion momentos__titulo">
        Aquí el día se toma su tiempo
      </h2>
    </header>

    <ul class="momentos__muro reveal-secuencia" role="list">

      <!-- ---------------------------------------------------------- 01/04
           PROTAGONISTA. Es el plano más abierto del cuarteto y por eso es el
           más ancho: sitúa al espectador (las varas, el verde del fondo, la
           luz) antes de que los otros tres se metan de cerca.               -->
      <li class="momentos__pieza momentos__pieza--uno reveal reveal--velo">
        <figure class="momentos__figura">
          <div class="marco momentos__marco">
            <video
              class="momentos__video"
              data-momento-video
              muted
              loop
              playsinline
              preload="none"
              poster="img/video/mariposa-naranja.jpg"
              width="720"
              height="1280"
              aria-hidden="true"
              tabindex="-1"
            >
              <source src="video/mariposa-naranja.webm" type="video/webm" />
              <source src="video/mariposa-naranja.mp4" type="video/mp4" />
            </video>
          </div>
          <figcaption class="momentos__pie">
            Una mariposa naranja se posa entre las varas moradas y sigue.
          </figcaption>
        </figure>
      </li>

      <!-- ---------------------------------------------------------- 02/04
           El clip largo (6,2 s) y el único primer plano: aguanta el bucle
           sin que se note el corte. Va desfasado hacia abajo para romper la
           línea superior.                                                   -->
      <li class="momentos__pieza momentos__pieza--dos reveal reveal--velo">
        <figure class="momentos__figura">
          <div class="marco momentos__marco">
            <video
              class="momentos__video"
              data-momento-video
              muted
              loop
              playsinline
              preload="none"
              poster="img/video/verbena-viento.jpg"
              width="720"
              height="1280"
              aria-hidden="true"
              tabindex="-1"
            >
              <source src="video/verbena-viento.webm" type="video/webm" />
              <source src="video/verbena-viento.mp4" type="video/mp4" />
            </video>
          </div>
          <figcaption class="momentos__pie">
            El viento mueve las varas en flor y una parda no se suelta.
          </figcaption>
        </figure>
      </li>

      <!-- ---------------------------------------------------------- 03/04
           Contraluz: el fondo se va a oscuro y la mariposa entra por el
           borde izquierdo. Se deja a tamaño medio y con poco desfase.       -->
      <li class="momentos__pieza momentos__pieza--tres reveal reveal--velo">
        <figure class="momentos__figura">
          <div class="marco momentos__marco">
            <video
              class="momentos__video"
              data-momento-video
              muted
              loop
              playsinline
              preload="none"
              poster="img/video/mariposa-amarilla.jpg"
              width="720"
              height="1280"
              aria-hidden="true"
              tabindex="-1"
            >
              <source src="video/mariposa-amarilla.webm" type="video/webm" />
              <source src="video/mariposa-amarilla.mp4" type="video/mp4" />
            </video>
          </div>
          <figcaption class="momentos__pie">
            A contraluz, una amarilla asoma por el borde del encuadre.
          </figcaption>
        </figure>
      </li>

      <!-- ---------------------------------------------------------- 04/04
           La pieza pequeña: dura dos segundos y va la más baja de las
           cuatro. Naranja sobre verde, que es lo que aguanta el tamaño
           chico; un plano de detalle sutil aquí no se leería.               -->
      <li class="momentos__pieza momentos__pieza--cuatro reveal reveal--velo">
        <figure class="momentos__figura">
          <div class="marco momentos__marco">
            <video
              class="momentos__video"
              data-momento-video
              muted
              loop
              playsinline
              preload="none"
              poster="img/video/mariposas-par.jpg"
              width="720"
              height="1280"
              aria-hidden="true"
              tabindex="-1"
            >
              <source src="video/mariposas-par.webm" type="video/webm" />
              <source src="video/mariposas-par.mp4" type="video/mp4" />
            </video>
          </div>
          <figcaption class="momentos__pie">
            Dos naranjas coinciden en la misma mata.
          </figcaption>
        </figure>
      </li>

    </ul>

  </div>

  <script src="js/momentos-video.js?v=b8002017" defer></script>
</section>
