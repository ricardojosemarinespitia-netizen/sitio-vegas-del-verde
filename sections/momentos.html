<!-- ==========================================================================
     FRAGMENTO: MOMENTOS  ·  id="momentos"
     CSS propio: styles/sections/momentos.css
     JS propio:  js/momentos-video.js   (reproducción perezosa de los clips)

     QUÉ ES: una banda de carbón que corta la página crema entre #planes y
     #colegios. Es la única pausa visual del recorrido: sirve para respirar,
     no para informar. Desde v3.1 ya no es una rejilla de fotos: es un MURO
     DE VÍDEO en vertical, metraje de móvil grabado en el predio.

     QUÉ CAMBIÓ EN v3.2 — EL MARCADO
       Sólo dos cosas, y ninguna toca el texto:
         · La cabecera pierde la clase de tamaño y gana el trato de CARTELA
           en la hoja (rótulo y titular en la misma línea de base, con filete
           a todo lo ancho). No cambia el marcado.
         · Cada pieza añade `reveal--velo` junto a `reveal`. Es la cortina de
           clip-path que ya estaba escrita en base.css §6 y que no usaba
           NINGUNA sección del sitio: la pieza se descubre de arriba abajo en
           vez de aparecer con un fundido. Es el gesto que le corresponde a un
           muro de vídeo, y al usarse sólo aquí no se gasta el recurso.
       Todo lo demás de la composición (anchos, desfases, sangría por la
       derecha, grano y viñeta) vive en momentos.css y no necesita marcado.

     POR QUÉ VERTICAL Y POR QUÉ ESCALONADO
       Los seis clips son 720×1280, retrato, sin pista de audio: son de
       teléfono, no de banco de imágenes. Presentarlos en una rejilla regular
       de recuadros iguales los devolvería al terreno del «genérico»: lo que
       delata a un muro de archivo es la simetría. Aquí van CUATRO piezas de
       anchos distintos (protagonista + tres menores) y con desfases
       verticales desiguales, de modo que la línea de arriba nunca coincide
       y la de abajo tampoco. La composición está en momentos.css §3.

     QUÉ POSEE ESTA SECCIÓN (ARQUITECTURA-V3, «un hecho, un dueño»)
       NADA. Ni un solo hecho. Esta sección es ATMÓSFERA PURA y por eso puede
       borrarse entera sin que la página pierda un dato.

     QUÉ TIENE PROHIBIDO DECIR
       TODO hecho: aforos, precios, horarios, direcciones, superficies,
       distancias, cifras de especies, condiciones de alquiler, nombres de
       espacios y nombres de planes. Los pies describen LO QUE SE VE en el
       clip y se paran ahí.
       OJO ESPECIAL CON ESTOS CLIPS: el jardín de polinizadores es un hecho
       de #colegios. Aquí se pueden VER mariposas y flores —son imagen—, pero
       no se puede afirmar que exista un jardín ni describirlo como
       instalación. Por eso ningún pie nombra «polinizadores», «jardín de
       mariposas» ni «avistamiento»: se describe el encuadre, no el
       equipamiento. Por lo mismo NO se usa el sexto clip disponible,
       video/jardin-polinizadores.*: su ruta viaja en el atributo `poster`,
       que herramientas/validar.py sí lee como texto, y colaría la palabra
       «polinizador» dentro de una sección que no es su dueña.

     LOS CUATRO CLIPS, EN ORDEN DE LECTURA
       01  video/mariposa-naranja.*   3,6 s · plano abierto de las varas
       02  video/verbena-viento.*     6,2 s · primer plano, la vara se mece
       03  video/mariposa-amarilla.*  4,6 s · contraluz, amarilla al borde
       04  video/mariposas-par.*      2,1 s · dos naranjas, la más pequeña
       Cada <video> lleva el webm PRIMERO y el mp4 después (el webm pesa más
       aquí, pero el orden lo decide el navegador por soporte, no por tamaño;
       Safari cae al mp4). `width`/`height` son los del archivo y el marco
       tiene `aspect-ratio`, así que no hay salto de layout.

     EL PÓSTER ES EL SUELO, NO HAY <img> DEBAJO
       Cada clip trae su propio fotograma en img/video/<mismo-nombre>.jpg.
       Si el vídeo no carga, si no hay JS, si el navegador bloquea la
       reproducción o si el usuario pide menos movimiento, se queda esa foto
       fija: nunca un hueco negro. Poner además un <img> debajo duplicaría la
       descarga para enseñar exactamente la misma imagen.
       Los cuatro pósters (unos 600 kB en total) SÍ se descargan siempre, aunque
       el visitante no llegue a esta altura de la página: `poster` no admite
       carga diferida. Es el precio de que la sección nunca aparezca vacía, y se
       paga a sabiendas. Los clips, que pesan varios megas, no se tocan hasta
       que la banda entra en pantalla.

     NO HAY ICONO DE PLAY, Y NO SE PONE
       Los clips arrancan solos, en silencio y en bucle, cuando entran en
       pantalla; se pausan al salir. No hay nada que pulsar, así que un
       triángulo encima sería un control falso. Toda esa lógica —incluida la
       de `prefers-reduced-motion`— vive en js/momentos-video.js.

     POR QUÉ EL <script> VA AQUÍ DENTRO Y NO AL FINAL DEL <body>
       herramientas/ensamblar.py copia tal cual la cola de index.html
       (donde están app.js y mapa.js), así que un fragmento no puede añadir
       nada allí. Se carga con `defer`, de modo que no bloquea el parseo y se
       ejecuta con el DOM ya completo, igual que los otros dos. Si el
       integrador prefiere tenerlo junto a los demás, puede moverlo a la cola
       de index.html y borrar esta línea: el JS no depende de dónde se cargue.

     POR QUÉ NO ESTÁ EN LA NAVEGACIÓN NI EN EL PIE
       Porque no es un destino. Nadie busca «momentos» en un menú; se lo
       encuentra al bajar. Meterla en el menú la convertiría en una promesa
       de contenido que esta sección no tiene intención de cumplir.
     ========================================================================== -->
<section id="momentos" class="seccion seccion--carbon momentos" aria-labelledby="momentos-titulo">
  <div class="contenedor">

    <!-- v3.4 · ESTA BANDA DEJA DE SER UNA SECCIÓN SUELTA
         (DIRECTRICES-ANIMACION.md §1). #planes, #momentos y #colegios son un
         solo capítulo, «Eventos y actividades», y esta banda es el RESPIRO
         que va en medio: no es un corte entre capítulos.
           · El eyebrow deja de ser «Momentos» y pasa al rótulo compartido de
             los tres. La ocasión concreta la sigue diciendo el h2.
           · El filete de apertura a todo lo ancho SALE de aquí (momentos.css
             §1): lo lleva #planes y sólo #planes, porque es el que abre el
             capítulo. Que esta cartela empiece sin línea es justamente lo que
             dice «esto sigue siendo lo mismo».
           · El h2 estrena .reveal-texto —la clase compartida de base.css
             §v7—, SIN la variante persiana: ésa se gasta una vez por capítulo
             y ya la lleva el titular de #planes.
         El header pasa de .reveal a .reveal-secuencia por el mismo motivo que
         en #planes: el titular necesita su propio .reveal y aquí los .reveal
         no se anidan. El header ya no revela, sólo reparte tiempos. -->
    <header class="seccion-encabezado momentos__encabezado reveal-secuencia">
      <p class="eyebrow reveal">Eventos y actividades</p>
      <h2
        id="momentos-titulo"
        class="titulo-seccion momentos__titulo reveal reveal-texto"
      >
        <span class="reveal-texto__linea">Aquí el día</span>
        <span class="reveal-texto__linea">se toma su tiempo</span>
      </h2>

      <!-- v3.3 · LA MARIPOSA QUE SE DIBUJA -----------------------------------
           La cartela deja a partir de 62em un tercio de ancho vacío a la
           derecha del titular (el titular va acotado a 20ch). Ahí entra el
           único trazo de toda la banda, y es el motivo que ya está en los
           cuatro clips: una mariposa.

           NO AÑADE NI UN HECHO. Va con `aria-hidden`, no lleva texto y no
           afirma nada: esta sección es atmósfera pura y sigue sin poseer un
           solo dato. Tampoco nombra el jardín de polinizadores, que es de
           #colegios (ver el contrato al principio de este archivo).

           FIRMA DEL MOTOR DE DIBUJADO, HORNEADA A MANO: `viewBox="0 0 24 24"`,
           `fill="none"`, `stroke="currentColor"`, la clase `icono-traza` en el
           elemento raíz y `pathLength="1"` en cada forma. Escrito en el HTML y no
           puesto por js/app.js —que va con defer— para que el trazo nazca
           oculto en el primer paint y no haya un fotograma de parpadeo.
           Es el primer .icono-traza de esta sección, así que también es lo que
           convierte #momentos en su propio disparador de dibujado.

           SIETE FORMAS Y SIETE TIEMPOS (momentos.css §10). El orden importa y no
           es simétrico: sale el ala superior izquierda, entra la superior
           derecha cuando a la primera le queda un tercio, después las dos
           inferiores, luego el cuerpo y al final las antenas, una detrás de
           otra. Si las dos alas de un par salieran a la vez, el trazo se
           leería como un logotipo desplegándose, no como algo dibujado.
           Cada <path> lleva una sola `M` para que el guion pueda recorrerlo
           de un tirón: un camino con varios trazos sueltos se ve
           entrecortado porque el guion tiene que atravesar también los
           saltos invisibles de un trazo al siguiente.                     -->
      <svg class="icono-traza momentos__mariposa" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="0.9"
           stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true" focusable="false">
        <path d="M11.6 8.6C10 5.4 7.4 3.3 4.9 3.6 2.6 3.9 1.9 6 3 8.6c1.1 2.6 3.3 3.9 8.6 3.4Z" pathLength="1"/>
        <path d="M12.4 8.6c1.6-3.2 4.2-5.3 6.7-5 2.3.3 3 2.4 1.9 5-1.1 2.6-3.3 3.9-8.6 3.4Z" pathLength="1"/>
        <path d="M11.6 12.6c-4.3-.9-7-.1-8 2.2-1 2.3.4 4.2 3.2 4.4 2.5.2 4.3-2 4.8-6.6Z" pathLength="1"/>
        <path d="M12.4 12.6c4.3-.9 7-.1 8 2.2 1 2.3-.4 4.2-3.2 4.4-2.5.2-4.3-2-4.8-6.6Z" pathLength="1"/>
        <path d="M12 7.8v9.4" pathLength="1"/>
        <path d="M11.2 7.4 8.9 4.2" pathLength="1"/>
        <path d="M12.8 7.4 15.1 4.2" pathLength="1"/>
      </svg>
    </header>

    <!-- v4.0 · LA BANDA SE VUELVE MARQUESINA — pedido explícito del cliente
         (chat, 23-ago-2026): «los videos que se vayan pasando de izquierda a
         derecha por la pantalla de todos los dispositivos». Deja de ser una
         composición fija con scroll manual y pasa a desplazarse SOLA, en
         bucle, en cualquier tamaño de pantalla.

         EL MECANISMO (documentado a fondo en momentos.css §2-§3): una PISTA
         (`momentos__pista`) que contiene el set de piezas DOS VECES seguidas
         — el truco estándar de marquesina sin salto — animada con
         `translateX` puro (compositor, GPU) dentro de un visor con
         `overflow: clip` (`momentos__visor`). Cuando la pista ha recorrido el
         50 % de su ancho total, el segundo set ocupa exactamente el lugar
         donde empezó el primero y el bucle reinicia sin que se note.

         POR QUÉ EL SEGUNDO SET NO LLEVA <video>. Duplicar cuatro <video> con
         el mismo `src` para el efecto de bucle es gratis en ANCHO DE BANDA
         (el navegador cachea la respuesta) pero NO es gratis en CPU: dos
         decodificadores de vídeo corriendo a la vez por clip duplican el
         trabajo del hilo de compositor sin que se note en pantalla — el
         segundo set casi siempre está fuera de vista o entrando. Por eso el
         set duplicado usa el mismo fotograma fijo (`poster`) como <img>: es
         el mismo archivo que ya se descargó para el `poster` del <video>
         real, cero peticiones nuevas, y visualmente es indistinguible de un
         fotograma del clip en movimiento salvo por una fracción de segundo.
         Va con `aria-hidden="true"` y sin `alt`: es una copia visual pura,
         el contenido real —con su texto— lo lee un lector de pantalla una
         sola vez, en el primer set.

         ORDEN Y POR QUÉ. Mismo orden de lectura que en v3 (naranja → viento →
         contraluz → par), PERO la pieza 04 (mariposas-par, «dos naranjas
         juntas») se separó del resto con un hueco propio
         (`momentos__pieza--cuatro`, ver momentos.css §3): es la pieza que el
         cliente señaló para moverse «más a la derecha» — es la última
         miniatura del cuarteto y, en la composición v3, quedaba la más
         escondida (sangrada fuera de pantalla, cortada por el borde). En la
         pista corrediza gana un margen izquierdo propio que la separa del
         trío anterior y la deja leerse SOLA, más a la derecha del grupo,
         en vez de pegada al resto como una quinta rueda.                    -->
    <div class="momentos__visor reveal reveal--velo">
      <ul class="momentos__pista" role="list">

        <!-- ---------------------------------------------------------- 01/04
             PROTAGONISTA. Es el plano más abierto del cuarteto: sitúa al
             espectador (las varas, el verde del fondo, la luz) antes de que
             los otros tres se metan de cerca.                               -->
        <li class="momentos__pieza momentos__pieza--uno">
          <figure class="momentos__figura">
            <div class="marco momentos__marco">
              <video
                class="momentos__video"
                data-momento-video
                muted
                loop
                playsinline
                preload="none"
                poster="img/video/mariposa-naranja.jpg"
                width="720"
                height="1280"
                aria-hidden="true"
                tabindex="-1"
              >
                <source src="video/mariposa-naranja.webm" type="video/webm" />
                <source src="video/mariposa-naranja.mp4" type="video/mp4" />
              </video>
            </div>
            <!-- El pie de la protagonista es un VERSO (momentos.css §5):
                 mismo texto, otra voz. Sólo cambia la clase; el contrato de
                 hechos queda intacto. -->
            <figcaption class="momentos__pie momentos__pie--verso">
              Una mariposa naranja se posa entre las varas moradas y sigue.
            </figcaption>
          </figure>
        </li>

        <!-- ---------------------------------------------------------- 02/04
             El clip largo (6,2 s) y el único primer plano: aguanta el bucle
             sin que se note el corte.                                       -->
        <li class="momentos__pieza momentos__pieza--dos">
          <figure class="momentos__figura">
            <div class="marco momentos__marco">
              <video
                class="momentos__video"
                data-momento-video
                muted
                loop
                playsinline
                preload="none"
                poster="img/video/verbena-viento.jpg"
                width="720"
                height="1280"
                aria-hidden="true"
                tabindex="-1"
              >
                <source src="video/verbena-viento.webm" type="video/webm" />
                <source src="video/verbena-viento.mp4" type="video/mp4" />
              </video>
            </div>
            <figcaption class="momentos__pie">
              El viento mueve las varas en flor y una parda no se suelta.
            </figcaption>
          </figure>
        </li>

        <!-- ---------------------------------------------------------- 03/04
             Contraluz: el fondo se va a oscuro y la mariposa entra por el
             borde izquierdo.                                                -->
        <li class="momentos__pieza momentos__pieza--tres">
          <figure class="momentos__figura">
            <div class="marco momentos__marco">
              <video
                class="momentos__video"
                data-momento-video
                muted
                loop
                playsinline
                preload="none"
                poster="img/video/mariposa-amarilla.jpg"
                width="720"
                height="1280"
                aria-hidden="true"
                tabindex="-1"
              >
                <source src="video/mariposa-amarilla.webm" type="video/webm" />
                <source src="video/mariposa-amarilla.mp4" type="video/mp4" />
              </video>
            </div>
            <figcaption class="momentos__pie">
              A contraluz, una amarilla asoma por el borde del encuadre.
            </figcaption>
          </figure>
        </li>

        <!-- ---------------------------------------------------------- 04/04
             La pieza pequeña: dura dos segundos. Naranja sobre verde, que es
             lo que aguanta el tamaño chico. MOVIDA MÁS A LA DERECHA (pedido
             explícito): gana un hueco propio antes de ella en momentos.css
             §3 para separarse del trío 01-03 y leerse sola.                 -->
        <li class="momentos__pieza momentos__pieza--cuatro">
          <figure class="momentos__figura">
            <div class="marco momentos__marco">
              <video
                class="momentos__video"
                data-momento-video
                muted
                loop
                playsinline
                preload="none"
                poster="img/video/mariposas-par.jpg"
                width="720"
                height="1280"
                aria-hidden="true"
                tabindex="-1"
              >
                <source src="video/mariposas-par.webm" type="video/webm" />
                <source src="video/mariposas-par.mp4" type="video/mp4" />
              </video>
            </div>
            <figcaption class="momentos__pie">
              Dos naranjas coinciden en la misma mata.
            </figcaption>
          </figure>
        </li>

      </ul>

      <!-- SEGUNDO SET — copia visual para el bucle sin salto, ver la nota de
           arriba. `aria-hidden` entero: nada de esto se anuncia dos veces. -->
      <ul class="momentos__pista momentos__pista--copia" role="list" aria-hidden="true">

        <li class="momentos__pieza momentos__pieza--uno">
          <figure class="momentos__figura">
            <div class="marco momentos__marco">
              <img class="momentos__video momentos__video--eco" src="img/video/mariposa-naranja.jpg"
                srcset="img/video/mariposa-naranja-400.jpg 400w, img/video/mariposa-naranja.jpg 720w"
                sizes="(max-width: 47.99em) 70vw, 38vw" alt="" width="720" height="1280" loading="lazy" decoding="async" />
            </div>
            <figcaption class="momentos__pie momentos__pie--verso">
              Una mariposa naranja se posa entre las varas moradas y sigue.
            </figcaption>
          </figure>
        </li>

        <li class="momentos__pieza momentos__pieza--dos">
          <figure class="momentos__figura">
            <div class="marco momentos__marco">
              <img class="momentos__video momentos__video--eco" src="img/video/verbena-viento.jpg"
                srcset="img/video/verbena-viento-400.jpg 400w, img/video/verbena-viento.jpg 720w"
                sizes="(max-width: 47.99em) 61vw, 32vw" alt="" width="720" height="1280" loading="lazy" decoding="async" />
            </div>
            <figcaption class="momentos__pie">
              El viento mueve las varas en flor y una parda no se suelta.
            </figcaption>
          </figure>
        </li>

        <li class="momentos__pieza momentos__pieza--tres">
          <figure class="momentos__figura">
            <div class="marco momentos__marco">
              <img class="momentos__video momentos__video--eco" src="img/video/mariposa-amarilla.jpg"
                srcset="img/video/mariposa-amarilla-400.jpg 400w, img/video/mariposa-amarilla.jpg 720w"
                sizes="(max-width: 47.99em) 61vw, 32vw" alt="" width="720" height="1280" loading="lazy" decoding="async" />
            </div>
            <figcaption class="momentos__pie">
              A contraluz, una amarilla asoma por el borde del encuadre.
            </figcaption>
          </figure>
        </li>

        <li class="momentos__pieza momentos__pieza--cuatro">
          <figure class="momentos__figura">
            <div class="marco momentos__marco">
              <img class="momentos__video momentos__video--eco" src="img/video/mariposas-par.jpg"
                srcset="img/video/mariposas-par-400.jpg 400w, img/video/mariposas-par.jpg 720w"
                sizes="(max-width: 47.99em) 61vw, 32vw" alt="" width="720" height="1280" loading="lazy" decoding="async" />
            </div>
            <figcaption class="momentos__pie">
              Dos naranjas coinciden en la misma mata.
            </figcaption>
          </figure>
        </li>

      </ul>
    </div>

  </div>

  <script src="js/momentos-video.js?v=89e009b7" defer></script>
</section>
