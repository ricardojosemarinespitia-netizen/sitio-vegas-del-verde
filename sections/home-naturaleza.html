<!-- ==========================================================================
     FRAGMENTO DE LA HOME: NATURALEZA EN TRES CIFRAS  ·  ancla #naturaleza
     CSS: styles/sections/home.css §2 y §3   ·   JS propio: NINGUNO

     QUÉ ES. El bloque 4 de la tabla del PLAN-REDISENO-V4 §4.2: tres cifras y
     un muro de SEIS aves, con salida a naturaleza.html.

     POR QUÉ SEIS Y NO CIENTO OCHO. El hallazgo nº 4 del plan: las 108
     fotografías de #naturaleza colgaban de la misma página que todo lo
     demás —167 <img> en el DOM y 1,8 MB de imagen en la carga inicial— y
     enterraban justo el activo más diferenciador del sitio. Las 108 viven
     ahora en naturaleza.html, con el concurso completo y sus créditos. Aquí
     hay seis, elegidas entre las que tienen especie identificada en
     img/aves/_creditos.json.

     v22 · DE DOCE A SEIS. El cliente dijo que la página está muy larga y esta
     sección era la segunda más alta de la home (2,14 pantallas de móvil). Doce
     miniaturas en una rejilla de tres columnas son cuatro filas; seis son dos,
     y el muro sigue haciendo su trabajo —enseñar que aquí hay fauna con
     nombre— porque el argumento no lo lleva el número de fotos sino la cifra
     de 101 especies, que sigue arriba. La galería completa está a un botón.
     No se retira NINGUNA foto de evento: éstas son de concurso y las 108
     siguen enteras en naturaleza.html.

     LOS CRÉDITOS VAN DEBAJO DE CADA FOTO, en el <figcaption>, nunca encima:
     el nombre del fotógrafo es información —se la ganó— y sobre la imagen ni
     se lee ni deja ver el ave. Corrección directa del cliente para esta fase.

     `alt=""` en las seis fotos es deliberado y no un descuido: cada imagen va
     dentro de una <figure> cuyo <figcaption> nombra la especie y el autor en
     texto real. Repetir eso en el alt haría que el lector de pantalla leyera
     dos veces lo mismo. Es el mismo patrón que usa el muro de naturaleza.html.
     ========================================================================== -->
