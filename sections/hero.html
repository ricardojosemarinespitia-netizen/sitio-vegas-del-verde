<!-- ==========================================================================
     FRAGMENTO: INICIO  ·  ancla #inicio
     CSS propio: styles/sections/inicio.css

     v40 «sólo la foto» (pedido del cliente, oct 2026): la portada es UNA
     fotografía quieta —el colibrí, la misma en móvil, tableta y escritorio— y
     UN titular en blanco, el único <h1> de la página, con sus dos botones
     (Ver los espacios · Ver los eventos). Sin subtítulo, sin entradilla,
     sin indicador de scroll, sin velo, sin orla y sin
     ningún efecto (ni mariposas, ni partículas, ni paralaje, ni revelados).
     El historial de lo retirado está en git.

     La fotografía es el LCP: fetchpriority alto, width/height para reservar la
     caja y NADA de loading perezoso. El AVIF se precarga en el <head>. El
     encuadre por dispositivo lo da `object-position` en inicio.css (--pos-foto):
     el colibrí ocupa de 35 % a 65 % del ancho, así que el 50 % lo deja en cuadro
     tanto en vertical como en horizontal. Los datos de propiedad de los hechos
     (tagline, «cuatro hectáreas», «a 10 minutos», «ponemos los árboles») ya no
     se escriben aquí.
     ========================================================================== -->
<section class="seccion inicio" id="inicio" aria-labelledby="inicio-titulo">

  <div class="inicio__portada">
    <picture>
      <source srcset="img/hero-colibri.avif" type="image/avif" />
      <source
        srcset="img/hero-colibri-400.webp 400w, img/hero-colibri-600.webp 600w, img/hero-colibri-800.webp 800w, img/hero-colibri-1200.webp 1200w, img/hero-colibri.webp 1600w"
        sizes="100vw"
        type="image/webp"
      />
      <img
        class="inicio__portada-foto"
        src="img/hero-colibri.jpg"
        srcset="img/hero-colibri-400.jpg 400w, img/hero-colibri-600.jpg 600w, img/hero-colibri-800.jpg 800w, img/hero-colibri-1200.jpg 1200w, img/hero-colibri.jpg 1600w"
        sizes="100vw"
        width="1600"
        height="1092"
        alt="Un colibrí en vuelo bebiendo de una flor morada, entre tallos de verbena y follaje del bosque de Vegas del Verde."
        fetchpriority="high"
        decoding="async"
      />
    </picture>

    <div class="contenedor contenedor--ancho inicio__portada-interior">
      <h1 class="titulo-seccion inicio__titulo" id="inicio-titulo">Escápate de la ciudad</h1>

      <!-- Los dos botones de la portada se conservan tal cual (pedido del
           cliente): «Ver los espacios» y «Ver los eventos». -->
      <div class="grupo-botones inicio__acciones">
        <a class="btn btn-fantasma btn-grande inicio__accion-secundaria" href="#espacios">
          Ver los espacios
        </a>
        <a class="btn btn-fantasma btn-grande inicio__accion-secundaria" href="planes.html">
          Ver los eventos
        </a>
      </div>
    </div>
  </div>

</section>
