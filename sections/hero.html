<!-- ==========================================================================
     FRAGMENTO: INICIO  ·  ancla #inicio
     CSS propio: styles/sections/inicio.css

     v5 «orgánica». v4 ya había roto el compás de la retícula partiendo la
     sección en dos escalas. Lo que seguía leyéndose como plantilla era la
     GEOMETRÍA: rectángulos a escuadra, corte recto entre la foto y la página,
     y seis miniaturas idénticas en fila. v5 mete el lenguaje orgánico que pide
     el sitio —es un bosque, no un panel de control—:

       · la portada ya no termina en una línea recta: una orla curva y
         ASIMÉTRICA (delgada a la izquierda, gruesa a la derecha) disuelve la
         fotografía en el papel y marca la diagonal por la que sigue el ojo.
       · el titular deja las mayúsculas (CONTRATO-V2 §3 las prohíbe por encima
         de 24 px salvo en el logotipo) y pasa a dos renglones de escala
         distinta: el segundo entra más pequeño y sangrado, como un pie de
         entrada editorial.
       · el plano-índice deja de ir a sangre por los dos lados: se alinea con
         el contenedor por la izquierda, se va de la ventana por la derecha y
         redondea sólo sus dos esquinas izquierdas.
       · la tira de aves deja de ser una fila de seis cuadrados iguales: seis
         tamaños distintos, dos alturas y radios de hoja alternos.

     La composición sigue partida en DOS MOVIMIENTOS de escala distinta, que es
     lo que separa una portada de un listado:

       1. PORTADA A SANGRE — una sola fotografía ocupando la ventana entera
          (menos la altura de la cabecera fija), con el titular encima en
          Fraunces fino y grande. Es lo primero que se ve y no comparte fila
          con nada.
       2. EL PLANO-ÍNDICE — el aéreo, que sigue sin ir metido en el
          contenedor, pero desde v5 ya no cruza la ventana por los dos lados:
          arranca en el margen del contenedor —la misma vertical que su pie y
          que la tira de aves— y se va de la pantalla por la derecha. La idea
          de v3 se conserva entera (cuatro anclas que bajan a cuatro
          secciones); lo que cambia es el tamaño y la mano por la que sangra.

     Los dos bloques son hijos DIRECTOS del <section>, no del .contenedor: así
     miden el 100 % del ancho del <body> —que ya descuenta la barra de scroll—
     y se van a sangre sin recurrir a 100vw, que sí desborda 15 px. El texto de
     cada bloque vuelve a la retícula con su propio .contenedor.

     LA SANGRÍA ALTERNA, Y NO ES CAPRICHO. El plano se va por la DERECHA porque
     la foto grande de #nosotros —la sección de debajo— se va por la IZQUIERDA.
     Dos bloques seguidos sangrando por la misma mano se leen como el mismo
     gesto repetido, que es exactamente la queja que se está corrigiendo.

     QUÉ POSEE ESTA SECCIÓN (ARQUITECTURA-V3 §9) Y NADIE MÁS
       · el tagline de marca, que va en el .eyebrow
       · el tamaño del predio: única mención en toda la página
       · la promesa de cercanía a la vía: única mención en ese registro
       · la frase «los árboles los ponemos nosotros», de la entradilla
       · img/aereo-predio.jpg convertido en PLANO-ÍNDICE
       · el rótulo del botón de esta sección, que no se repite en ninguna otra

     Los cuatro primeros van escritos UNA sola vez cada uno, y sólo en el
     texto visible: por eso este comentario no los reproduce. La verificación
     de ARQUITECTURA-V3 §11 se hace con `grep` y hay que poder pasarla.

     QUÉ TIENE PROHIBIDO DECIR
       Ninguna cifra de biodiversidad, ningún aforo, ninguna dirección, ningún
       horario, ninguna condición de alquiler y ningún precio. Se enlaza, no se
       resume: para eso están las cuatro anclas del plano.

     POR QUÉ EL <h1>
       La estructura de sección pide h2.titulo-seccion, y de ahí saca el peso,
       el tracking y la familia. Sólo cambia la etiqueta, porque #inicio es la
       primera sección de la página y ninguna otra lleva h1: dejarla en h2
       dejaría el documento sin encabezado de nivel 1 (BRIEF, «Calidad
       exigida» → SEO y accesibilidad). Si el ensamblador exige h2 literal, es
       un carácter: cámbialo y nada más.
     ========================================================================== -->
<section class="seccion inicio" id="inicio" aria-labelledby="inicio-titulo">

  <!-- ======================================================================
       1. PORTADA A SANGRE
       La fotografía NO se difiere: es el LCP de la página, así que va con
       fetchpriority alto y sin el atributo de carga perezosa. Es un <img> y no
       un background-image justamente por eso —un fondo de CSS no se puede
       priorizar ni describir— y porque así lleva su propio texto alternativo.

       El velo es un <div> vacío y no un ::after de la portada porque encima
       de él va el texto: con un pseudoelemento habría que ordenar tres capas
       con z-index sobre el mismo elemento y el orden natural del documento ya
       resuelve dos de ellas.
       ====================================================================== -->
  <!-- `sobre-oscuro` NO es decoración: es el interruptor que base.css usa para
       invertir dos cosas sobre fondo oscuro y que aquí faltaban.
         · `:focus-visible` pasa del contorno verde bosque (2:1 contra esta
           fotografía velada: prácticamente invisible al tabular) al amarillo
           del logo, 7,3:1. Es el arreglo de accesibilidad más grande que tenía
           pendiente la portada.
         · `.btn-fantasma` pasa a crema, que es lo que permite poner un segundo
           botón de contorno sobre la foto sin escribir ni una variante nueva.
       Va en la PORTADA y no en la sección entera a propósito: de la mitad de
       abajo para adelante el fondo vuelve a ser el papel crema. -->
  <div class="inicio__portada sobre-oscuro">

    <!-- v6 · LA PORTADA DEJA DE SER PAISAJE Y PASA A SER RETRATO.
         La foto anterior (img/portada-inicio.jpg) era un prado a mediodía sin
         sujeto: sin persona, sin animal, sin acontecimiento. Su propio texto
         alternativo lo delataba —cuarenta palabras describiendo césped—, y de
         ahí colgaba todo lo demás: el velo tenía que ser espeso porque el
         cielo blanco no aguantaba texto crema encima, y no había ni una capa
         que interpenetrar porque no había nada que estuviera delante de nada.

         Ahora la ventana entera la ocupa el barranquero de Leyner Lozano, del
         concurso de fotografía del predio. Es el ave que ya encabeza la tira
         de esta misma sección y la que está pintada como mural en el predio,
         así que la metáfora no se importa de fuera: ya estaba aquí.

         EL <picture> Y EL ORDEN DE LOS FORMATOS. AVIF primero, WebP después,
         JPG como respaldo del <img>: el navegador se queda con el primero que
         entienda y no descarga los otros. Pesos reales de la derivación:
         AVIF 104 KB · WebP 143 KB · JPG 221 KB. El <img> conserva
         fetchpriority alto, width/height para reservar la caja antes de que
         llegue un byte, y NADA de loading perezoso: es el LCP.  -->
    <picture>
      <source srcset="img/hero-momotus.avif" type="image/avif" />
      <source srcset="img/hero-momotus.webp" type="image/webp" />
      <img
        class="inicio__portada-foto"
        src="img/hero-momotus.jpg"
        width="1600"
        height="2400"
        alt="Barranquero (Momotus subrufescens) posado en una rama del bosque, con una baya en el pico y la cola de raqueta colgando. Fotografía de Leyner Lozano."
        fetchpriority="high"
        decoding="async"
      />
    </picture>

    <div class="inicio__portada-velo" aria-hidden="true"></div>

    <!-- ORLA ORGÁNICA — el borde inferior de la portada.
         Va pintada del color del papel (`currentColor`, que inicio.css fija en
         --color-fondo), así que no es una forma encima de la foto: es el papel
         subiendo a comerse la foto. La curva es ASIMÉTRICA a propósito —16 de
         120 de alto en el borde izquierdo, 94 en el derecho—: una ola simétrica
         es el divisor de plantilla que se ve en cualquier sitio; una diagonal
         curva lleva el ojo desde el titular (abajo a la izquierda) hasta donde
         arranca el plano-índice. Por eso el texto sólo tiene que despejar la
         parte fina, aunque el relleno de abajo despeja la orla entera.
         preserveAspectRatio="none" para que estire con la ventana sin dejar
         franja: el alto lo manda --alto-orla en el CSS. -->
    <svg
      class="inicio__portada-orla"
      viewBox="0 0 1440 120"
      preserveAspectRatio="none"
      aria-hidden="true"
      focusable="false"
    >
      <path
        d="M0,120 V104 C 260,104 430,88 700,66 C 980,44 1180,20 1440,26 V120 Z"
        fill="currentColor"
      />
    </svg>

    <!-- EL ENJAMBRE — la caja vacía donde js/enjambre-hero.js suelta nueve
         mariposas y un colibrí. Va VACÍA en el HTML a propósito: las piezas se
         crean después del decode() de la portada, así que no hay ni un byte
         de PNG compitiendo con el LCP, y como no existen al primer pintado no
         hay ningún estado inicial que pueda parpadear.
         Vive en la mitad derecha —el tercio limpio de la fotografía, el único
         sitio donde no está ni el pájaro ni el texto— y por debajo del
         encabezado en la pila de capas: si un día una mariposa se cruzara con
         el titular, pasaría por detrás. -->
    <div class="inicio__enjambre" aria-hidden="true"></div>

    <div class="contenedor contenedor--ancho inicio__portada-interior">
      <!-- ENTRADA ESCALONADA, NO UN BLOQUE QUE APARECE ENTERO.
           Hasta aquí el encabezado era UN solo `.reveal`: los cuatro elementos
           —rótulo, titular, entradilla y botones— aparecían de golpe, que es
           exactamente el gesto de una plantilla. Ahora el contenedor es una
           `.reveal-secuencia` y cada hijo entra por su cuenta con el retardo
           que ya reparte base.css (0 · 90 · 180 · 270 ms): el ojo recorre la
           composición en el mismo orden en que hay que leerla.

           NO SE INVENTA NINGÚN MECANISMO: es el sistema de revelado del sitio,
           con su estado inicial escrito en CSS estático (`.js .reveal`) desde
           el primer pintado —así que no hay un solo fotograma de parpadeo— y
           con `prefers-reduced-motion` ya resuelto en base.css, que anula el
           desplazamiento y los retardos.

           El .reveal del propio <header> SE RETIRA: dejarlo encima haría que
           el bloque se desvaneciera dos veces, una como grupo y otra por hijo.
           La clase `.reveal-secuencia` sola no oculta nada. -->
      <header class="seccion-encabezado inicio__encabezado reveal-secuencia">
        <p class="eyebrow reveal">Oasis para la recreación y el bienestar</p>

             editorial. El segundo renglón entra más pequeño y sangrado, y lleva
             delante una hoja diminuta (::before en el CSS) que es el mismo
             remate de .lista-hojas de base.css: la forma de la casa.
             Los dos van en crema; el contraste lo hacen el cuerpo y la sangría,
             nunca el color, porque debajo hay una fotografía y el coral claro
             sobre el cielo blanco de este archivo se quedaría en 3,6:1. -->
        <!-- v9 · EL TITULAR SUBE EN PERSIANA, RENGLÓN A RENGLÓN.
             La portada es el capítulo cero del sitio, y DIRECTRICES §
             «Variante persiana» reserva ese gesto —una vez por capítulo— al
             titular de apertura. Cero JS nuevo: .reveal ya lo ve el
             observador de js/app.js, y el estado inicial (cada renglón
             escondido tras su máscara) lo hornea base.css §v7 en CSS
             estático, con el colchón de descendentes (0.18em) ya resuelto

             legible. Cada renglón visual va envuelto en su propio
             .reveal-texto__linea, POR FUERA del .inicio__titulo-linea, para

             tipografía existente. -->
        <h1 class="titulo-seccion inicio__titulo reveal reveal-texto reveal-texto--persiana" id="inicio-titulo">
          <!-- EL QUIEBRE VA HORNEADO, Y ES UN ARREGLO MEDIDO, NO UN CAPRICHO.

             pantalla lo lee seguido igual. -->
        <span class="reveal-texto__linea"><span class="inicio__titulo-linea">Escápate<br />de la ciudad</span></span>
          <span class="reveal-texto__linea"><span class="inicio__titulo-linea inicio__titulo-linea--menor">sin salir de ella</span></span>

    <!-- ======================================================================
         LA CAPA DE RECORTE — la profundidad, sin un solo byte de red

         Es la MISMA fotografía pintada por segunda vez, encima del titular, y
         recortada con un `clip-path` que sigue el contorno del pájaro. El
         resultado es que la cola de raqueta cuelga POR DELANTE de las letras
         mientras el resto del titular sigue leyéndose sobre el bosque: tres
         capas interpenetradas en vez de tres capas apiladas.

         POR QUÉ NO CUESTA NADA. La URL es idéntica a la del LCP —mismo
         `<picture>`, mismas fuentes AVIF/WebP/JPG—, así que el navegador la
         sirve de la imagen que ya descargó y decodificó: una sola petición de
         red para las dos capas. `clip-path` con un polígono es trabajo del
         compositor, no del hilo principal.

         POR QUÉ EL POLÍGONO VA POR DENTRO DEL PÁJARO Y NO HOLGADO. Debajo de
         esta capa hay un velo de legibilidad; lo que esta capa recorta se
         pinta SIN ese velo. Si el polígono se saliera del pájaro, ese sobrante
         sería una mancha de bosque sin velar —más clara que su alrededor— con
         un borde poligonal perfectamente visible. Al revés no pasa nada: si el
         polígono muerde unos píxeles del pájaro, esos píxeles siguen ahí
         debajo, idénticos, en la capa de la foto. Se pierde nada y se gana el
         no tener franja. Los 35 puntos están medidos sobre la imagen derivada

         por construcción es exactamente la caja de la imagen (ver inicio.css).

         `aria-hidden` y `alt` vacío: es la misma fotografía que ya está
         descrita treinta líneas más arriba. Nadie tiene que oírla dos veces.

         En móvil NO SE MONTA (inicio.css la apaga por debajo de 64em): a 375
         px el `cover` deja la cola fuera de cuadro y el recorte no recortaría

         ====================================================================== -->

       2. EL PLANO-ÍNDICE  (ARQUITECTURA-V3 §1.1)

           rejilla de pastillas que las anclas forman debajo del plano en
           móvil y en tableta.

       La superposición sólo existe a partir de 64em. Por debajo, las cuatro
       anclas bajan del plano y se convierten en una rejilla de pastillas: en
       una pantalla de teléfono un punto de 12 px sobre una foto de 190 px de
       alto no se acierta con el dedo (inicio.css lo explica en detalle).

  <figure class="inicio__plano reveal reveal--velo">

      <!-- ESPACIOS VA PRIMERO, y es la otra mitad del encargo comercial.
           En escritorio las cuatro anclas están posicionadas en absoluto sobre
           sus coordenadas del render, así que el ORDEN DEL DOCUMENTO no mueve
           nada de sitio: lo único que cambia es qué se lee primero con el
           lector de pantalla y qué se alcanza primero con el tabulador. En
           móvil y tableta —donde las cuatro bajan a una rejilla— sí cambia el
           orden visual, y también ahí Espacios encabeza.
           Antes el recorrido empezaba por Vivero, que es la venta más pequeña

  <!-- ======================================================================
       EL AIRE DEL BOSQUE — canvas de partículas sobre la portada
       Motas de polen y alguna hoja soltándose de las copas, coordinadas a la
       zona real de follaje de la fotografía. Módulo: js/particulas-hero.js;
       su regla de capa (.inicio__particulas) vive en inicio.css.

       POR QUÉ ASÍ Y NO CON <script src> EN EL <head>:
       · El import es DINÁMICO y espera al decode() de la foto de portada:
         hasta que el LCP no está decodificado no se pide un solo byte del
         módulo. La portada carga exactamente igual que sin él.
       · Con prefers-reduced-motion NO SE MONTA: no es que la animación vaya
         a cero — es que el módulo ni siquiera se descarga.
       · Si el import falla (navegador viejo, red), el catch lo deja morir en
         silencio: la portada queda con su foto y no le falta nada.
       · Es type="module" (diferido por definición): no bloquea el parser ni
         necesita estado inicial en el CSS — no toca nada que ya exista en el
         primer paint, sólo AÑADE un lienzo vacío cuando todo lo demás llegó.
       El propio módulo se pausa fuera del viewport y con la pestaña en
       segundo plano, y se desmonta si el visitante reduce el movimiento con
       la página abierta.
       ====================================================================== -->
  <script type="module">
    const portada = document.querySelector('.inicio__portada');
    const foto = document.querySelector('.inicio__portada-foto');
    const reducido = window.matchMedia('(prefers-reduced-motion: reduce)');
    if (portada && foto && !reducido.matches) {
      /* Siempre decode(), sin atajo por `complete`: con decoding="async" una
         foto en caché llega a complete=true con los bytes descargados pero
         AÚN SIN DECODIFICAR, que es justo la carrera que este cerrojo
         evita. decode() resuelve en el acto si ya está decodificada y
         espera también la carga si no ha terminado: cubre los dos casos. */
      foto.decode().catch(() => {})
        .then(() => Promise.all([
          import('./js/particulas-hero.js?v=0fef6596')
            .then((m) => m?.montarParticulas(portada, foto))
            .catch(() => {}),
          /* El enjambre va DESPUÉS del mismo cerrojo y en su propia rama: si
             uno de los dos módulos falla, el otro sigue vivo. Los PNG de las
             mariposas no se piden hasta aquí, así que no compiten con el LCP
             ni por red ni por decodificación. */
          import('./js/enjambre-hero.js?v=b8fb2f94')
            .then((m) => m?.montarEnjambre(document.querySelector('.inicio__enjambre')))
            .catch(() => {}),
        ]))
        .catch(() => {});
    }
  </script>
