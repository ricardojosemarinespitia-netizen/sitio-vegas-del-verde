<!-- ==========================================================================
     FRAGMENTO: INICIO  ·  ancla #inicio
     CSS propio: styles/sections/inicio.css

     v4 «abrir de verdad». Hasta v3 esta sección era una más de la retícula:
     rótulo, titular, entradilla y una foto dentro del contenedor, igual que
     las ocho siguientes. Ahora se parte en DOS MOVIMIENTOS de escala distinta,
     que es lo que separa una portada de un listado:

       1. PORTADA A SANGRE — una sola fotografía ocupando la ventana entera
          (menos la altura de la cabecera fija), con el titular encima en
          Fraunces fino y grande. Es lo primero que se ve y no comparte fila
          con nada.
       2. EL PLANO-ÍNDICE — el aéreo, que ya no va metido en el contenedor:
          cruza la ventana de borde a borde y llega a los 729 px de alto en un
          escritorio de 1440. La idea de v3 se conserva entera (cuatro anclas
          que bajan a cuatro secciones); lo que cambia es el tamaño.

     Los dos bloques son hijos DIRECTOS del <section>, no del .contenedor: así
     miden el 100 % del ancho del <body> —que ya descuenta la barra de scroll—
     y se van a sangre sin recurrir a 100vw, que sí desborda 15 px. El texto de
     cada bloque vuelve a la retícula con su propio .contenedor.

     QUÉ POSEE ESTA SECCIÓN (ARQUITECTURA-V3 §9) Y NADIE MÁS
       · el tagline de marca, que va en el .eyebrow
       · el tamaño del predio: única mención en toda la página
       · la promesa de cercanía a la vía: única mención en ese registro
       · la frase «los árboles los ponemos nosotros», de la entradilla
       · img/aereo-predio.jpg convertido en PLANO-ÍNDICE
       · el rótulo del botón de esta sección, que no se repite en ninguna otra

     Los cuatro primeros van escritos UNA sola vez cada uno, y sólo en el
     texto visible: por eso este comentario no los reproduce. La verificación
     de ARQUITECTURA-V3 §11 se hace con `grep` y hay que poder pasarla.

     QUÉ TIENE PROHIBIDO DECIR
       Ninguna cifra de biodiversidad, ningún aforo, ninguna dirección, ningún
       horario, ninguna condición de alquiler y ningún precio. Se enlaza, no se
       resume: para eso están las cuatro anclas del plano.

     POR QUÉ EL <h1>
       La estructura de sección pide h2.titulo-seccion, y de ahí saca el peso,
       el tracking y la familia. Sólo cambia la etiqueta, porque #inicio es la
       primera sección de la página y ninguna otra lleva h1: dejarla en h2
       dejaría el documento sin encabezado de nivel 1 (BRIEF, «Calidad
       exigida» → SEO y accesibilidad). Si el ensamblador exige h2 literal, es
       un carácter: cámbialo y nada más.
     ========================================================================== -->
<section class="seccion inicio" id="inicio" aria-labelledby="inicio-titulo">

  <!-- ======================================================================
       1. PORTADA A SANGRE
       La fotografía NO se difiere: es el LCP de la página, así que va con
       fetchpriority alto y sin el atributo de carga perezosa. Es un <img> y no
       un background-image justamente por eso —un fondo de CSS no se puede
       priorizar ni describir— y porque así lleva su propio texto alternativo.

       El velo es un <div> vacío y no un ::after de la portada porque encima
       de él va el texto: con un pseudoelemento habría que ordenar tres capas
       con z-index sobre el mismo elemento y el orden natural del documento ya
       resuelve dos de ellas.
       ====================================================================== -->
  <div class="inicio__portada">

    <img
      class="inicio__portada-foto"
      src="img/portada-inicio.jpg"
      width="1400"
      height="2489"
      alt="Prado del predio en un mediodía despejado: dos árboles grandes de copa abierta dan sombra sobre el césped, una hilera de arbustos cierra el fondo y tres materas de barro con flores se alinean en primer plano sobre un murito de piedra."

      decoding="async"

    <div class="inicio__portada-velo" aria-hidden="true"></div>

    <div class="contenedor contenedor--ancho inicio__portada-interior">

  </div>

  <!-- ======================================================================
       2. EL PLANO-ÍNDICE  (ARQUITECTURA-V3 §1.1)
       El aéreo deja de ser papel pintado: es el índice del sitio entero.
       Cuatro anclas internas —Espacios, Sendero, Vivero, Cómo llegar— para
       que el visitante vea de qué se compone el predio antes de leer nada, y
       para que ninguna sección de más abajo tenga que re-listar lo que hay.

       Las cuatro coordenadas (left/top en %) se eligieron ampliando el render
       antes de fijarlas; van en inicio.css, no aquí, para que mover un punto
       no obligue a tocar el HTML.

       TRES CAJAS Y NO UNA, a propósito:
         .inicio__plano-lienzo → sólo da el sistema de coordenadas. No recorta.
         .inicio__plano-marco  → el que lleva la proporción y el recorte.
         .inicio__anclas       → hermana del marco, NO hija. Si viviera dentro
           del marco, el `overflow: hidden` que recorta la foto se comería la
           rejilla de pastillas que las anclas forman debajo del plano en
           móvil y en tableta.

       La superposición sólo existe a partir de 64em. Por debajo, las cuatro
       anclas bajan del plano y se convierten en una rejilla de pastillas: en
       una pantalla de teléfono un punto de 12 px sobre una foto de 190 px de
       alto no se acierta con el dedo (inicio.css lo explica en detalle).
       ====================================================================== -->
  <figure class="inicio__plano reveal">

    <div class="inicio__plano-lienzo">

      <div class="inicio__plano-marco">
        <img
          class="inicio__plano-foto"
          src="img/aereo-predio.jpg"
          width="2000"
          height="1013"
          alt="Vista aérea del predio de Vegas del Verde: un paseo ancho de tierra clara cruza en diagonal el prado, con las construcciones de techo blanco y la estructura de techo translúcido arriba, una vela de sombra triangular sobre el césped y el camino de acceso abajo a la derecha; el bosque lo rodea por los cuatro costados."
          loading="lazy"
          decoding="async"
        />
      </div>

      <ul class="inicio__anclas" role="list" aria-label="Índice del predio sobre el plano">
        <li class="inicio__ancla-item inicio__ancla-item--vivero">
          <a class="inicio__ancla" href="#vivero">

        </li>
        <li class="inicio__ancla-item inicio__ancla-item--sendero">

            <span class="inicio__rotulo">Sendero</span>

        </li>
        <li class="inicio__ancla-item inicio__ancla-item--espacios">
          <a class="inicio__ancla" href="#espacios">
            <span class="inicio__punto" aria-hidden="true"></span>
            <span class="inicio__rotulo">Espacios</span>
          </a>
        </li>
        <li class="inicio__ancla-item inicio__ancla-item--llegar">
          <a class="inicio__ancla" href="#ubicacion">
            <span class="inicio__punto" aria-hidden="true"></span>
            <span class="inicio__rotulo">Cómo llegar</span>
          </a>
        </li>
      </ul>

    </div>

    <figcaption class="inicio__plano-pie">
      El predio visto desde arriba. Cada punto del plano baja a esa parte del sitio.
    </figcaption>

  </figure>

  <!-- ======================================================================
       TIRA DE AVES — ATMÓSFERA, NO ARCHIVO  (ARQUITECTURA-V3 §5)
       Seis fotos del concurso en papel decorativo: aquí NO llevan ficha ni
       crédito visible, porque el único sitio del sitio con fichas acreditadas

       El crédito al fotógrafo no se pierde: va en el `alt`, y sale literal de
       img/aves/_creditos.json. Nunca se inventa un autor.
       Orden: ave-46 · ave-38 · ave-27 · ave-07 · ave-56 · ave-31.
       La tira ya no va centrada: arranca en el margen izquierdo del
       contenedor, alineada con el pie del plano. Seis cuadrados centrados

       ====================================================================== -->
  <ul class="inicio__aves reveal" role="list">
