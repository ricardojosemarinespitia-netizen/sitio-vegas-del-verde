<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Vegas del Verde</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/img/logo/simbolo-vegas.png">
<!-- fuentes-propias: Josefin Sans y DM Sans viven en styles/fonts/ y se declaran
     por @font-face en base.css — no hay <link> a fonts.googleapis.com,
     ni preconnect a Google. La precarga es lo único que sigue haciendo
     falta: hace que el navegador pida el woff2 desde el primer instante,
     en paralelo a parsear el CSS, en vez de esperar a descubrir el
     @font-face durante el layout. Con display: optional (en base.css) y
     el archivo del propio dominio, la fuente casi siempre llega dentro de
     la ventana corta que el navegador le da antes de resignarse a la del
     sistema — sin swap visible. Se regenera con
     herramientas/precargar-fuentes.js. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="/styles/fonts/dm-sans-latin.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/styles/fonts/josefin-sans-latin.woff2">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/base.css">
<style>
  .error-404 {
    min-height: 100svh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: var(--esp-xl) var(--padding-contenedor);
    background: var(--color-fondo);
  }
  .error-404__logo { width: 5.5rem; height: auto; margin-bottom: var(--esp-lg); }
  .error-404__codigo {
    font-family: var(--fuente-display);
    font-size: var(--paso-6);
    line-height: 1;
    color: var(--color-acento-texto);
    margin: 0 0 var(--esp-sm);
  }
  .error-404__titulo {
    font-family: var(--fuente-titulo);
    text-transform: uppercase;
    letter-spacing: var(--track-caps);
    font-size: var(--fs-h3);
    font-weight: var(--peso-ligero);
    color: var(--color-texto);
    margin: 0 0 var(--esp-md);
  }
  .error-404__texto {
    max-width: var(--medida-corta);
    margin: 0 auto var(--esp-lg);
    color: var(--color-texto-suave);
  }
</style>
</head>
<body>
  <main class="error-404">
    <div>
      <!-- v2 · `simbolo-vegas.png` no es transparente (cuadrado blanco
           opaco): sobre el crema del fondo se veía como una caja gris,
           el mismo defecto que ya se corrigió en el header/pie del sitio
           principal (ver sections/_header.html v30). El cliente pidió
           "el logo el mismo en todas partes" — pasa al mismo recorte
           transparente que usa el resto del sitio. -->
      <img class="error-404__logo" src="/img/logo/simbolo-transparente.png" width="744" height="351" alt="Vegas del Verde">
      <p class="error-404__codigo">404</p>
      <h1 class="error-404__titulo">Esta página se perdió en el bosque</h1>
      <p class="error-404__texto">
        La dirección que buscas no existe o cambió de lugar.
        Te llevamos de vuelta al inicio.
      </p>
      <div class="grupo-botones" style="justify-content:center">
        <a class="btn btn-primario" href="/">Volver al inicio</a>
        <a class="btn btn-whatsapp" href="https://wa.me/573166758362?text=Hola%2C%20quiero%20informaci%C3%B3n%20sobre%20Vegas%20del%20Verde" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>
      </div>
    </div>
  </main>
</body>
</html>
